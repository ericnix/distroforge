[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distroforge"
version = "0.1.0"
description = "Construtor de distros Linux: perfil neutro, builders e adapters de instalador"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "DistroForge contributors" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
vm = ["vncdotool>=1.4"]
gui = ["PySide6>=6.8"]

[project.scripts]
distroforge = "distroforge.cli:main"
distroforge-gui = "distroforge.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/distroforge"]

# O catálogo do repositório viaja junto com o pacote, então o CLI instalado
# funciona fora da árvore de código-fonte.
[tool.hatch.build.targets.wheel.force-include]
"catalog" = "distroforge/catalog_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
