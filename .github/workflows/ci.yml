name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependências
        working-directory: site
        run: npm ci

      # `npm run build` roda o prebuild, que exporta catalog/*.yaml → JSON.
      - name: Build
        working-directory: site
        run: npm run build

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar o pacote
        run: python -m pip install -e ".[dev]"

      - name: Testes
        run: python -m pytest

      - name: Gerar árvore de build (dry-run)
        run: |
          distroforge init --out /tmp/profile.yaml
          distroforge plan /tmp/profile.yaml
          distroforge generate /tmp/profile.yaml --out /tmp/build
          distroforge build /tmp/profile.yaml --out /tmp/out --dry-run
