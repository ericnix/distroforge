name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependências
        working-directory: site
        run: npm ci

      # `npm run build` roda o prebuild, que exporta catalog/*.yaml → JSON.
      - name: Build
        working-directory: site
        run: npm run build
